name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (from rust-toolchain.toml)
        run: rustup show

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Ubuntu: mesa software renderer (no GPU in GitHub Actions)
      - name: Install Mesa (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libvulkan1 mesa-vulkan-drivers libegl1-mesa-dev \
            libx11-xcb-dev libxcb-xfixes0-dev

      - name: Build workspace
        run: cargo build --workspace

      - name: Test workspace
        env:
          # Force software (llvmpipe) so no GPU is needed
          MESA_NO_ERROR: "1"
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: cargo test --workspace

      - name: Clippy (no new warnings)
        run: cargo clippy --workspace -- -D warnings
