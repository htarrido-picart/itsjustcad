# Codifies the Contributor License Agreement in git: on a contributor's first
# PR the bot asks them to comment their agreement, records their signature
# (GitHub identity + timestamp + CLA version) into .github/cla-signatures.json,
# and blocks merge until signed. That committed record + CLA.md's git hash are
# the durable, auditable proof of what each contributor agreed to.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: '.github/cla-signatures.json'
          path-to-document: 'https://github.com/htarrido-picart/itsjustcad/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'htarrido-picart,dependabot[bot]'
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-notsigned-prcomment: 'Thanks for the PR. Before it can be merged, please read our [CLA](CLA.md) and sign it by commenting the exact line below. Your signature (GitHub id + timestamp + CLA version) is recorded in git.'
