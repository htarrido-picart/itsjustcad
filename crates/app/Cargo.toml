[package]
name = "itsjustcad"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "itsjustcad"
path = "src/main.rs"

# Icon generator: `test = true` so its squircle-mask unit tests run under
# `cargo test` (examples are not tested by default).
[[example]]
name = "gen_icon"
test = true

[features]
default = []
# Opt-in exact-BREP tier: forwards to itsjustcad-commands' `kernel-occt` feature
# (statically links OpenCASCADE). OFF by default; the normal app build never
# needs CMake, a C++ toolchain, or OCCT.
kernel-occt = ["itsjustcad-commands/kernel-occt"]

[dependencies]
itsjustcad-doc.workspace = true
itsjustcad-solar.workspace = true
kernel-curve.workspace = true
itsjustcad-commands.workspace = true
itsjustcad-deck.workspace = true
itsjustcad-render.workspace = true
itsjustcad-raytrace.workspace = true
kernel-mesh.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
eframe.workspace = true
glam.workspace = true
tokio.workspace = true
reqwest.workspace = true
futures.workspace = true
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rfd.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
aes-gcm.workspace = true
keyring.workspace = true
rusqlite.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Base64-encode a screenshot/attached image for the local vision (mmproj) path:
# ChatRequest carries images as raw base64, which the OpenAI-compat cassette
# wraps into a `data:` image_url. Version matches the workspace lock (transitive).
base64 = "0.22"
pollster = "0.4"
egui_commonmark = "0.24"
raw-window-handle = "0.6"
# OS clipboard read for the text-input right-click Paste (egui exposes write via
# ctx.copy_text but not read). Already in the tree via eframe.
arboard = "3"

# True native OS menus (macOS global NSMenu bar / Windows HMENU).
# Linux uses the in-window egui bar instead — muda pulls gtk/glib on Linux
# which requires system libraries CI does not install.
[target.'cfg(not(target_os = "linux"))'.dependencies]
muda = "0.19"

# macOS-only: disable AppKit's automatic window tabbing (kills the auto-injected
# "Show Tab Bar" / "Show All Tabs" View items). objc2 is already in the tree via
# muda; declaring it here makes the AppKit call explicit and version-pinned.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["wgpu", "snapshot", "eframe"] }
# Round-trips the .ico synthesized by build_support/icon.rs in tests.
ico = "0.4"

# Windows exe icon embedding (issue #19). Both crates are tiny and pure Rust;
# build.rs no-ops on non-Windows targets, so Linux/macOS builds only pay the
# one-time cost of compiling these two small build deps.
# (`[target.'cfg(windows)'.build-dependencies]` keys on the HOST, not the
# target, so unconditional deps + a target check in build.rs is the correct
# way to support cross-compiling to Windows.)
[build-dependencies]
ico = "0.4"
winresource = "0.1"
