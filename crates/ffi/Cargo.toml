[package]
name = "itsjustcad-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# staticlib → the `.a` linked into the iOS app; lib → host unit tests / cbindgen.
[lib]
crate-type = ["staticlib", "lib"]

[dependencies]
itsjustcad-doc.workspace = true
itsjustcad-commands.workspace = true
itsjustcad-deck.workspace = true
itsjustcad-render.workspace = true
kernel-mesh.workspace = true
serde_json.workspace = true
wgpu.workspace = true
glam.workspace = true
tokio.workspace = true
raw-window-handle = "0.6"
pollster = "0.4"
# Underlay decode on the iOS render path (desktop owns this via its own `image`
# dep). jpeg: chat photo attachments are saved as JPEG; png: typical underlays.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[dev-dependencies]
async-trait.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
